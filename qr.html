<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QRコード台紙 | TOKYO WASABI 衛生記録</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="icons/admin-192.png" sizes="192x192">
<link rel="stylesheet" href="style.css">
<style>
  /* この台紙だけの見た目。印刷して現場に貼るためのページ */
  .qr-sheet { max-width: 820px; margin: 0 auto; padding: 18px 14px 40px; }
  .qr-lead { color: var(--ink-2); font-size: 14px; margin-bottom: 18px; }

  .qr-card {
    background: #fff;
    border: 2px solid var(--charcoal);
    border-radius: 16px;
    padding: 22px 18px 18px;
    text-align: center;
    margin-bottom: 18px;
    break-inside: avoid;
  }
  .qr-card h2 { font-size: 22px; margin-bottom: 2px; }
  .qr-card .qr-sub { color: var(--ink-3); font-size: 13px; }
  .qr-box { display: grid; place-items: center; margin: 14px 0 10px; }
  .qr-box img, .qr-box canvas { display: block; }
  .qr-how { font-size: 14px; font-weight: 700; }
  .qr-url { font-size: 11px; color: var(--ink-3); word-break: break-all; margin-top: 6px; }
  .qr-miss { color: var(--danger); font-size: 13px; }

  @media print {
    @page { size: A4 portrait; margin: 12mm; }
    .no-print { display: none !important; }
    .qr-sheet { max-width: none; padding: 0; }
    .qr-card { border-color: #000; margin-bottom: 14mm; }
  }
</style>
</head>
<body class="admin">

<header class="app-head no-print">
  <div class="head-top"><h1>衛生記録<span class="head-sub">QRコード台紙</span></h1></div>
</header>

<div class="qr-sheet">
  <p class="qr-lead no-print">
    印刷して、それぞれの場所（工場の入口、キッチンカーの中）に貼ってください。
    スマホのカメラを向けるだけで、その場所の記録画面が開きます。
  </p>
  <div id="cards"></div>
</div>

<script src="common.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
  /* このページと同じ場所にある index.html を指す URL を作る */
  var base = location.href.replace(/qr\.html.*$/, '') + 'index.html';

  var html = SITES.map(function (s) {
    return (
      '<div class="qr-card">' +
      '<h2>' + esc(s.name) + '</h2>' +
      '<p class="qr-sub">' + esc(s.sub) + '</p>' +
      '<div class="qr-box" id="qr-' + esc(s.key) + '"></div>' +
      '<p class="qr-how">作業の前と後に、ここを読みとって記録してください</p>' +
      '<p class="qr-url">' + esc(base + '?site=' + s.key) + '</p>' +
      '</div>'
    );
  }).join('');
  document.getElementById('cards').innerHTML = html;

  SITES.forEach(function (s) {
    var box = document.getElementById('qr-' + s.key);
    if (typeof QRCode === 'undefined') {
      // ネットにつながっていないと QR を作る部品が読み込めない
      box.innerHTML =
        '<p class="qr-miss">QRコードを作れませんでした。' +
        'ネットにつながった状態で、この画面を開き直してください。</p>';
      return;
    }
    new QRCode(box, {
      text: base + '?site=' + s.key,
      width: 220,
      height: 220,
      colorDark: '#2b3134',
      colorLight: '#ffffff',
      correctLevel: QRCode.CorrectLevel.M,
    });
  });
</script>
</body>
</html>
